# dnsbench — curated provider catalog
# Embedded into the binary via $embed_file. See docs/DATA.md for inclusion criteria.
#
# Endpoints verified 2026-08-29. Providers change endpoints; verify before trusting.
# Tag vocabulary is a closed set — see docs/DATA.md. Declared-only tags are never
# allowed to contribute to a measured subscore.

version = 5
generated = "2026-08-29"

# ── NextDNS ──────────────────────────────────────────────────────────────────
# The __PROFILE__ placeholder is substituted from --nextdns-id or config.
# Without an ID this entry is skipped and only the public resolver is tested.
[[provider]]
key      = "nextdns"
label    = "NextDNS (profile)"
udp4     = ["45.90.28.0", "45.90.30.0"]
udp6     = ["2a07:a8c0::__PROFILE6__", "2a07:a8c1::__PROFILE6__"]
dot      = "__PROFILE__.dns.nextdns.io"
doh      = "https://dns.nextdns.io/__PROFILE__"
tags     = ["dnssec", "ecs", "nolog", "configurable"]
homepage = "https://nextdns.io"
notes    = "IPv4 anycast applies the profile only with a Linked IP; on mobile use DoT/DoH."

[[provider]]
key      = "nextdns-public"
label    = "NextDNS (public)"
udp4     = ["45.90.28.0"]
dot      = "dns.nextdns.io"
doh      = "https://dns.nextdns.io"
tags     = ["dnssec", "nolog", "nofilter"]
homepage = "https://nextdns.io"

