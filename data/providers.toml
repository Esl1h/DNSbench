# ── Quad9 ────────────────────────────────────────────────────────────────────
# Three variants are shipped deliberately: the ECS difference between 9.9.9.9 and
# 9.9.9.11 is one of the clearest demonstrations of what the edge probe measures.
[[provider]]
key      = "quad9"
label    = "Quad9"
udp4     = ["9.9.9.9", "149.112.112.112"]
udp6     = ["2620:fe::fe", "2620:fe::9"]
dot      = "dns.quad9.net"
doh      = "https://dns.quad9.net/dns-query"
tags     = ["dnssec", "malware", "nolog", "nonprofit"]
homepage = "https://quad9.net"
notes    = "No ECS. Privacy-motivated; costs CDN mapping quality. Compare with quad9-ecs."

[[provider]]
key      = "quad9-ecs"
label    = "Quad9 (ECS)"
udp4     = ["9.9.9.11", "149.112.112.11"]
udp6     = ["2620:fe::11", "2620:fe::fe:11"]
dot      = "dns11.quad9.net"
doh      = "https://dns11.quad9.net/dns-query"
tags     = ["dnssec", "ecs", "malware", "nolog", "nonprofit"]
homepage = "https://quad9.net"
notes    = "Prefer over quad9 where CDN performance matters."

[[provider]]
key      = "quad9-unsecured"
label    = "Quad9 (unfiltered)"
udp4     = ["9.9.9.10", "149.112.112.10"]
udp6     = ["2620:fe::10", "2620:fe::fe:10"]
dot      = "dns10.quad9.net"
doh      = "https://dns10.quad9.net/dns-query"
tags     = ["ecs", "nolog", "nofilter", "nonprofit"]
homepage = "https://quad9.net"
notes    = "No DNSSEC validation, no filtering. Baseline for isolating filtering cost."

