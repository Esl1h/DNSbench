# ── CDN hosts for the edge probe ─────────────────────────────────────────────
# Targets for `--probes ecs`. The probe resolves each host through every provider
# and times a TCP connect to the address it got back, so the entries have to be
# CDNs with enough points of presence that a bad ECS decision is visible as
# distance. A two-PoP CDN cannot expose one. docs/METHODOLOGY.md § ecs.
#
# expect_cname_suffix is the health check: if the chain no longer ends there, the
# entry is measuring something other than the CDN it was chosen for and is marked
# stale rather than quietly contributing a wrong number.
#
# Chains verified 2026-08-29 against 1.1.1.1, 8.8.8.8, 9.9.9.9 and 208.67.222.222
# from São Paulo.

[[cdn_host]]
host = "www.microsoft.com"
cdn  = "akamai"
expect_cname_suffix = "akamaiedge.net"

[[cdn_host]]
host = "storage.googleapis.com"
cdn  = "google"
expect_cname_suffix = ""

[[cdn_host]]
host = "assets.nflxext.com"
cdn  = "netflix"
expect_cname_suffix = ""

[[cdn_host]]
host = "www.fastly.com"
cdn  = "fastly"
expect_cname_suffix = "fastly.net"

[[cdn_host]]
host = "cdn.jsdelivr.net"
cdn  = "multi"
expect_cname_suffix = ""
