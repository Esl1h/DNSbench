name: ci

on:
  push:
  pull_request:

env:
  # Pinned for the same reason .github/workflows/release.yml pins it: V is
  # not API-stable, and an unpinned checkout means this workflow tests
  # whatever vlang/v's master happens to be on the day it runs rather than
  # the compiler docs/RELEASING.md's reproducibility section is about.
  V_COMMIT: cbf4e85
  # The bootstrap snapshot of the generated-C compiler in vlang/vc, which
  # compiles v1 out of v.c, moves much faster than any V pin does: a newer
  # snapshot can emit calls to builtins the pinned V tree does not have and
  # need more memory to compile cmd/v than the pinned compiler's own build
  # allows, and `make -C`'s latest_vc target pulls master whichever pin is
  # used. 9d047035 is the 2026-09-01 snapshot that pairs with c-dog857; pick
  # the newest one that still bootstraps the V_COMMIT of the day by finding
  # its "[v:master] <sha>" label in the vc log.
  VC_COMMIT: 9d047035

jobs:
  check:
    # Pinned rather than ubuntu-latest, and for the same reproducibility
    # reason V_COMMIT is: two catalog tests panicked here with "interface
    # method walker__Modifier.modify not implemented", V's own generated C
    # dispatch code breaking, reproducibly, only on ubuntu-latest (24.04)
    # and never locally against the identical V_COMMIT. release.yml already
    # pins ubuntu-22.04 for its build matrix; this matches it.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The vc snapshot is pinned and the bootstrap is done by hand, because
      # GNUmakefile's latest_vc target unconditionally pulls vc master. This
      # is the same two-stage self-compile `make -C /tmp/v` performs, minus
      # the pull, plus the pinned vc.
      - name: Install V
        run: |
          git clone --filter=blob:none https://github.com/vlang/v /tmp/v
          git -C /tmp/v checkout "$V_COMMIT"
          git clone --filter=blob:none https://github.com/vlang/vc /tmp/v/vc
          git -C /tmp/v/vc checkout "$VC_COMMIT"
          cd /tmp/v
          cc -std=c99 -w -o /tmp/v/v1 /tmp/v/vc/v.c -lm -lpthread
          /tmp/v/v1 -no-parallel -o /tmp/v/v2 -gc none cmd/v
          /tmp/v/v2 -nocache -o /tmp/v/v -gc none cmd/v
          rm -f /tmp/v/v1 /tmp/v/v2
          bash /tmp/v/cmd/tools/select_linux_tcc.sh fresh /tmp/v/thirdparty/tcc \
            https://github.com/vlang/tccbin amd64 /tmp/v
          echo "/tmp/v" >> "$GITHUB_PATH"

      # Every step below goes through the Makefile rather than repeating the
      # command, because the two drifted once: the build moved from a file to a
      # directory when the frontend grew a second file, and this workflow kept
      # compiling one file of a two-file module.
      - name: Format check
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Validate golden JSON against schema
        run: |
          pip install --quiet check-jsonschema
          make schema

      # core/doh_h2_d_doh_h2.v only compiles with -d doh_h2; without this,
      # its stub is what -d doh_h2 would replace, and CI would never notice
      # if the real implementation stopped compiling.
      - name: Install libcurl for the -d doh_h2 build
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Build and test with -d doh_h2
        run: |
          make build CURL=1
          make test CURL=1

# CI must never generate traffic to third-party resolvers.
# Integration tests run against a local mock authoritative server.
